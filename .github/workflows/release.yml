name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip forks and the run re-triggered by semantic-release's own version commit
    if: github.repository == 'pressw-llc/excel-explorer' && !startsWith(github.event.head_commit.message, 'chore(release)')
    environment: release

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          # Never restore the Actions cache on the publish path — a poisoned
          # cache entry in the default-branch scope would otherwise feed
          # tampered packages straight into the release build.
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -v --tb=short

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@350c48fcb3ffcdfd2e0a235206bc2ecea6b69df0 # v10.5.3
        with:
          github_token: ${{ secrets.GH_TOKEN }}

      # PSR builds inside its own Docker container, so its artifacts never reach
      # the runner. Build here, on the runner, from the exact tag PSR just created.
      - name: Build distribution
        if: steps.release.outputs.released == 'true'
        run: |
          git checkout "${{ steps.release.outputs.tag }}"
          rm -rf dist
          uv build

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
